name: Convert to GGUF

on:
  workflow_dispatch:
  push:
    paths:
      - 'checkpoints/model-final.pt'
      - 'scripts/convert_to_gguf.py'
      - '.github/workflows/convert-gguf.yml'

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true            # penting kalau .pt disimpan via Git LFS

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers sentencepiece protobuf numpy

      - name: Clone llama.cpp
        run: git clone --depth 1 https://github.com/ggerganov/llama.cpp.git
      
      - name: Install llama.cpp python deps
        run: pip install -r llama.cpp/requirements.txt

      - name: Build llama.cpp (untuk llama-quantize)
        run: |
          cmake -S llama.cpp -B llama.cpp/build -DGGML_NATIVE=OFF -DLLAMA_CURL=OFF
          cmake --build llama.cpp/build --config Release -j

      - name: Convert .pt -> GGUF (f16)
        run: python scripts/convert_to_gguf.py

      # Opsional: quantize langsung di CI
      - name: Quantize ke Q4_K_M
        run: |
          ./llama.cpp/build/bin/llama-quantize \
            checkpoints/model-final.gguf \
            checkpoints/model-final-Q4_K_M.gguf \
            Q4_K_M

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gguf-model
          path: checkpoints/*.gguf
          retention-days: 30
