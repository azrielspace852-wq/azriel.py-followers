name: Download AI Model

on:
  # Jalankan manual dari tab Actions
  workflow_dispatch:
    inputs:
      model_name:
        description: 'Nama model yang akan di-download'
        required: false
        default: 'qwen2.5-coder:7b'
        type: string
  # Opsional: jalankan otomatis setiap push ke main
  push:
    branches: [ main ]
    paths:
      - 'download_ai.py'
      - '.github/workflows/download-ai.yml'

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # download model besar bisa lama

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🦙 Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama --version

      - name: 🚀 Start Ollama service
        run: |
          # Jalankan ollama serve di background
          nohup ollama serve > ollama.log 2>&1 &
          # Tunggu sampai service siap
          for i in {1..30}; do
            if curl -s http://localhost:11434/api/tags > /dev/null; then
              echo "✅ Ollama service is ready"
              break
            fi
            echo "Menunggu Ollama... ($i/30)"
            sleep 2
          done

      - name: 📦 Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # Tambahkan package lain jika script memerlukannya
          # pip install requests

      - name: ⬇️ Run download script
        env:
          MODEL_NAME: ${{ github.event.inputs.model_name || 'qwen2.5-coder:7b' }}
        run: |
          python download_ai.py

      - name: 📋 List downloaded models
        if: always()
        run: |
          ollama list || echo "Tidak ada model terdaftar"

      - name: 📤 Upload Ollama logs (jika gagal)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ollama-logs
          path: ollama.log
          retention-days: 7
