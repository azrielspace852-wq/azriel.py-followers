name: Pre-Train AI Model

on:
  workflow_dispatch:
    inputs:
      epochs:
        description: "Jumlah epoch training"
        required: false
        default: "3"
      batch_size:
        description: "Batch size"
        required: false
        default: "8"
      learning_rate:
        description: "Learning rate"
        required: false
        default: "5e-5"

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 340      # Batas maksimum job publik GitHub Actions ~360 menit (6 jam)

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy tqdm

      - name: Cari file dataset-jsonl.zip
        id: find_zip
        run: |
          echo "Mencari dataset-jsonl.zip di seluruh repo..."
          ZIP_PATH=$(find . -type f -iname "dataset-jsonl.zip" | head -n 1)
          if [ -z "$ZIP_PATH" ]; then
            echo "File dataset-jsonl.zip tidak ditemukan di repo!"
            exit 1
          fi
          echo "Ditemukan di: $ZIP_PATH"
          echo "zip_path=$ZIP_PATH" >> "$GITHUB_OUTPUT"

      - name: Ekstrak dataset
        run: |
          mkdir -p dataset_extracted
          unzip -o "${{ steps.find_zip.outputs.zip_path }}" -d dataset_extracted
          echo "Isi folder hasil ekstrak:"
          ls -la dataset_extracted

      - name: Cari file .jsonl di root hasil ekstrak
        id: find_jsonl
        run: |
          JSONL_PATH=$(find dataset_extracted -maxdepth 1 -type f -iname "*.jsonl" | head -n 1)
          if [ -z "$JSONL_PATH" ]; then
            echo "Tidak ada file .jsonl ditemukan di root folder hasil ekstrak!"
            exit 1
          fi
          echo "Dataset ditemukan: $JSONL_PATH"
          echo "jsonl_path=$JSONL_PATH" >> "$GITHUB_OUTPUT"

      - name: Jalankan Pre-Training
        run: |
          python scripts/train.py \
            --dataset "${{ steps.find_jsonl.outputs.jsonl_path }}" \
            --epochs "${{ github.event.inputs.epochs }}" \
            --batch-size "${{ github.event.inputs.batch_size }}" \
            --lr "${{ github.event.inputs.learning_rate }}" \
            --output-dir checkpoints

      - name: Upload hasil model (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: model-checkpoints
          path: checkpoints/
          retention-days: 7
 
