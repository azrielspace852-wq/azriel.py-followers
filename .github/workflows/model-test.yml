name: Model Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true          # hapus jika checkpoint tidak via Git LFS

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install PyTorch (CPU only)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -r eval/requirements.txt

      - name: Check artifacts
        run: |
          ls -lh checkpoints/
          test -f checkpoints/model-final.pt || { echo "model-final.pt hilang"; exit 1; }
          test -f checkpoints/tokenizer.json || { echo "tokenizer.json hilang"; exit 1; }

      - name: Run model test
        run: python eval/eval.py

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: test-report.json
